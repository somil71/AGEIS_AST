name: Sentinel Compliance Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Sentinel Auditor
        uses: ./
        with:
          policies-dir: 'docs'
          directories: 'src'
