[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "needle"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "A local-first hybrid search engine with keyword + semantic search"

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive"] }

# AST parsing and chunking
tree-sitter = "0.20"
tree-sitter-python = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-go = "0.20"
tree-sitter-java = "0.20"
tree-sitter-cpp = "0.22"
tree-sitter-php = "0.20"

# File watching
notify = "6.1"

# Memory mapping
memmap2 = "0.9"

# Hashing (content dedup)
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Parallelism
rayon = "1.7"
crossbeam = "0.8"

# Unicode support
unicode-normalization = "0.1"
unicode-segmentation = "1.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Cryptographic Audit Ledger & Signing (Pure offline crypto)
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"

# ── Optional Cloud / Network Dependencies ───────────────────────────────────
axum = { version = "0.7", optional = true, features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors"], optional = true }
open = { version = "5", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros"], optional = true }
tower-cookies = { version = "0.10", optional = true }
time = { version = "0.3", optional = true }
urlencoding = { version = "2", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

# PDF text extraction (pure Rust)
pdf-extract = "0.7"

# RNG (HNSW layer sampling)
rand = "0.8"

# Time
chrono = "0.4"

# Path utilities
dirs = "5"

# Walk directories
walkdir = "2.4"

# Progress bars
indicatif = "0.17"

# Colored terminal output
colored = "2"

# UUID generation
uuid = { version = "1", features = ["v4"] }
tree-sitter-c-sharp = "0.20"
tree-sitter-ruby = "0.20"
tree-sitter-bash = "0.20"
tree-sitter-sql = "0.0.2"
pulldown-cmark = "0.9"
tokio-stream = "0.1.19"
async-stream = "0.3.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[features]
default = ["cloud"]
cloud = [
    "dep:axum",
    "dep:tower-http",
    "dep:tower-cookies",
    "dep:sqlx",
    "dep:reqwest",
    "dep:open",
    "dep:urlencoding",
    "dep:time",
]
sovereign = []

[[bench]]
name = "hnsw_bench"
harness = false

[[bench]]
name = "bm25_bench"
harness = false

[[bench]]
name = "embedding_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"
